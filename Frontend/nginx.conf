server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 30m;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Static and uploaded files are shared with the Django containers through
    # named volumes. This avoids asking Gunicorn to serve files.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Keep API requests same-origin in the browser and preserve the public Host
    # so absolute media URLs never contain the internal Docker hostname `web`.
    location /api/ {
        proxy_http_version 1.1;
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_http_version 1.1;
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # JS/MJS/CSS filenames are stable (not content-hashed), so they must revalidate.
    # Nginx does not consistently map .mjs in its default MIME table; set a safe
    # default for native ES modules while preserving mapped JS types.
    location ~* \.(?:js|mjs)$ {
        try_files $uri =404;
        default_type application/javascript;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.css$ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:woff2|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
