name: hamamooz-frontend

services:
  frontend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${HAMAMOOZ_FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
