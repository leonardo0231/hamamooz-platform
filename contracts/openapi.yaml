          description: نشان می‌دهد که آیا این کاربر اجازهٔ فعالیت دارد یا خیر. به
            جای حذف کاربر این تیک را بردارید.
        must_change_password:
          type: boolean
          readOnly: true
        role_assignments:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: آخرین ورود
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ پیوستن
      required:
      - date_joined
      - email
      - id
      - last_login
      - must_change_password
      - role_assignments
      - username
    UserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: نام کاربری
