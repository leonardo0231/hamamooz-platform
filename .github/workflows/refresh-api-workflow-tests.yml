name: Refresh API Workflow Tests

on:
  push:
    branches:
      - backend/comprehensive-manual-hardening
    paths:
      - scripts/refresh_api_workflow_tests.py
      - .github/workflows/refresh-api-workflow-tests.yml

permissions:
  contents: write

jobs:
  refresh-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend/comprehensive-manual-hardening
          fetch-depth: 0

      - name: Update legacy import API workflow tests
        run: python scripts/refresh_api_workflow_tests.py

      - name: Format updated test file
        run: |
          python -m pip install ruff==0.12.4
          ruff format Backend/tests/test_api_workflows.py
          ruff check --fix Backend/tests/test_api_workflows.py

      - name: Commit updated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/tests/test_api_workflows.py
          git commit -m "test: align API workflows with comprehensive-only imports"
          git push origin HEAD:backend/comprehensive-manual-hardening
