name: PR Branch Boundary

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate-branch-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changed paths
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Head branch: ${HEAD_REF}"
          echo "Changed files:"

          git -c core.quotePath=false diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | tee changed-files.txt

          if [ "${HEAD_REF}" = "backend/mvp-bootstrap" ]; then
            INVALID_FILES="$(
              grep -Ev '^(Backend/|contracts/|docs/|scripts/|\.github/|README\.md$|\.gitignore$|\.env\.example$|docker-compose\.yml$)' changed-files.txt || true
            )"

            if [ -n "${INVALID_FILES}" ]; then
              echo "Backend branch contains changes outside allowed backend/integration paths:"
              echo "${INVALID_FILES}"
              exit 1
            fi

          elif [ "${HEAD_REF}" = "frontend/mvp-bootstrap" ]; then
            INVALID_FILES="$(
              grep -Ev '^(Frontend/|contracts/|\.github/workflows/frontend-ci\.yml$)' changed-files.txt || true
            )"

            if [ -n "${INVALID_FILES}" ]; then
              echo "Frontend branch contains changes outside Frontend, API contract, or frontend CI paths:"
              echo "${INVALID_FILES}"
              exit 1
            fi

          elif [ "${HEAD_REF}" = "docs/main-readme-api-contracts" ]; then
            INVALID_FILES="$(
              grep -Ev '^(docs/|contracts/|README\.md$)' changed-files.txt || true
            )"

            if [ -n "${INVALID_FILES}" ]; then
              echo "Docs branch contains changes outside documentation and contract paths:"
              echo "${INVALID_FILES}"
              exit 1
            fi

          else
            echo "Pull requests to main are only allowed from:"
            echo "- backend/mvp-bootstrap"
            echo "- frontend/mvp-bootstrap"
            echo "- docs/main-readme-api-contracts"
            exit 1
          fi

          echo "Branch boundary validation passed."
