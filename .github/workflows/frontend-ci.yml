name: Frontend CI

on:
  push:
    branches:
      - main
      - frontend/mvp-bootstrap
    paths:
      - "Frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Install contract generator dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Regenerate API catalog
        run: npm run generate:api

      - name: Verify committed API catalog
        run: git diff --exit-code -- src/api/generated

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test
