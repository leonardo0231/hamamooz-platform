name: Sync Generated API Artifacts

on:
  push:
    branches:
      - backend/comprehensive-manual-hardening
    paths:
      - ".github/workflows/sync-generated-api.yml"

permissions:
  contents: write

jobs:
  sync-generated-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hamamooz_test
          POSTGRES_USER: hamamooz
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hamamooz -d hamamooz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://hamamooz:test-password@localhost:5432/hamamooz_test
      DJANGO_SECRET_KEY: ci-only-secret-key-at-least-50-characters-long-123456
      USE_S3: "false"
      SENTRY_DSN: ""

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: backend/comprehensive-manual-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements/*.txt

      - name: Install backend dependencies
        working-directory: Backend
        run: pip install -r requirements/dev.txt

      - name: Generate committed OpenAPI contract
        working-directory: Backend
        run: |
          python manage.py spectacular \
            --api-version v1 \
            --file ../contracts/openapi.yaml \
            --validate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Regenerate frontend API catalog
        working-directory: Frontend
        run: npm run generate:api

      - name: Use generated endpoint registry in manual entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Frontend/src/pages/manual-entry.ts")
          text = path.read_text()
          import_line = "import { endpoints } from '../api/endpoints.js';\n"
          anchor = "import { apiRequest } from '../api/client.js';\n"
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line, 1)
          replacements = {
              "apiRequest<MetricCatalogResponse>('/api/v1/monthly-evaluations/catalog/')":
                  "apiRequest<MetricCatalogResponse>(endpoints.monthlyEvaluations.catalog)",
              "apiRequest<Pagination<MonthlyEvaluationRecord>>('/api/v1/monthly-evaluations/', {":
                  "apiRequest<Pagination<MonthlyEvaluationRecord>>(endpoints.monthlyEvaluations.list, {",
              "apiRequest<ManualEvaluationSaveResponse>('/api/v1/monthly-evaluations/manual/', {":
                  "apiRequest<ManualEvaluationSaveResponse>(endpoints.monthlyEvaluations.manual, {",
              "apiRequest(`/api/v1/monthly-evaluations/${encodeURIComponent(id)}/manual/`, {":
                  "apiRequest(endpoints.monthlyEvaluations.manualDelete(id), {",
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f"expected manual-entry endpoint expression was not found: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit generated artifacts and endpoint migration
        run: |
          if git diff --quiet -- contracts/openapi.yaml Frontend/src/api/generated Frontend/src/pages/manual-entry.ts; then
            echo "Generated API artifacts and manual endpoint usage are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.yaml Frontend/src/api/generated/catalog.json Frontend/src/api/generated/catalog.ts Frontend/src/pages/manual-entry.ts
          git commit -m "chore: sync manual entry with generated API contract"
          git push origin HEAD:backend/comprehensive-manual-hardening
