name: Refresh OpenAPI Schema

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: schema-generation-secret
      JWT_SIGNING_KEY: schema-generation-jwt-secret
      USE_S3: "false"

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and validate schema
        run: |
          uv run python manage.py spectacular \
            --file docs/openapi-schema.yml \
            --validate

      - name: Commit schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/openapi-schema.yml

          if git diff --cached --quiet; then
            echo "OpenAPI schema is already current."
            exit 0
          fi

          git commit -m "docs(api): refresh OpenAPI schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"