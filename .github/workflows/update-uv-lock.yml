name: Refresh uv Lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    name: Update Python lockfile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Upgrade Pillow in lockfile
        run: |
          uv lock --upgrade-package pillow

      - name: Verify locked environment
        run: |
          uv sync --locked

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml uv.lock

          if git diff --cached --quiet; then
            echo "No lockfile changes detected."
            exit 0
          fi

          git commit -m "fix(deps): upgrade Pillow to secure version"
          git push origin "HEAD:${GITHUB_REF_NAME}"
