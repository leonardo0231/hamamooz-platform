name: Backend CI

on:
  push:
    branches:
      - backend/mvp-bootstrap
      - agent/sync-backend-snapshot
    paths:
      - "Backend/**"
      - "contracts/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Backend/**"
      - "contracts/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hamamooz_test
          POSTGRES_USER: hamamooz
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hamamooz -d hamamooz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://hamamooz:test-password@localhost:5432/hamamooz_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CELERY_TASK_ALWAYS_EAGER: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-at-least-50-characters-long-123456
      USE_S3: "false"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ATTENDANCE_ASYNC_NOTIFICATIONS: "false"
      SENTRY_DSN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit production dependencies
        run: pip-audit --cache-dir /tmp/pip-audit-cache -r requirements/production.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check hamamooz config tests

      - name: Django system check
        run: python manage.py check

      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Generate and validate OpenAPI schema
        run: |
          python manage.py spectacular \
            --api-version v1 \
            --file ../contracts/openapi.generated.yaml \
            --validate

      - name: Verify committed OpenAPI contract
        run: |
          diff -u \
            ../contracts/openapi.yaml \
            ../contracts/openapi.generated.yaml

      - name: Smoke test Redis and Celery broker
        run: |
          python - <<'PY'
          import os
          import redis
          from config.celery import app

          assert redis.Redis.from_url(os.environ["REDIS_URL"]).ping()
          with app.connection_for_write() as connection:
              connection.ensure_connection(max_retries=1)
          PY

      - name: Smoke test private S3 storage against MinIO
        env:
          AWS_ACCESS_KEY_ID: hamamooz-ci
          AWS_SECRET_ACCESS_KEY: hamamooz-ci-secret
          AWS_STORAGE_BUCKET_NAME: hamamooz-ci-private
          AWS_S3_ENDPOINT_URL: http://localhost:9000
          AWS_S3_REGION_NAME: us-east-1
          USE_S3: "true"
        run: |
          trap 'docker rm --force hamamooz-minio-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name hamamooz-minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl --fail --silent http://localhost:9000/minio/health/live
          python - <<'PY'
          import os
          import boto3

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["AWS_S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
              region_name=os.environ["AWS_S3_REGION_NAME"],
          )
          bucket = os.environ["AWS_STORAGE_BUCKET_NAME"]
          client.create_bucket(Bucket=bucket)
          client.put_bucket_versioning(
              Bucket=bucket,
              VersioningConfiguration={"Status": "Enabled"},
          )
          assert client.get_bucket_versioning(Bucket=bucket)["Status"] == "Enabled"
          client.put_object(Bucket=bucket, Key="smoke/health.txt", Body=b"ok")
          assert client.get_object(Bucket=bucket, Key="smoke/health.txt")["Body"].read() == b"ok"
          client.delete_object(Bucket=bucket, Key="smoke/health.txt")
          PY

      - name: Run backend tests
        run: pytest --cov=hamamooz --cov-report=xml

      - name: PostgreSQL backup and restore drill
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: hamamooz_test
          PGUSER: hamamooz
          PGPASSWORD: test-password
          BACKUP_DIR: /tmp/hamamooz-backups
        run: |
          mkdir --parents "$BACKUP_DIR"
          docker run --rm --network host \
            --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER --env PGPASSWORD \
            --env BACKUP_DIR=/backups \
            --volume "$PWD/scripts:/scripts:ro" --volume "$BACKUP_DIR:/backups" \
            postgres:17-alpine /scripts/backup_postgres.sh > /tmp/backup-path.txt
          backup_name="$(basename "$(cat /tmp/backup-path.txt)")"
          docker run --rm --network host \
            --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD \
            postgres:17-alpine createdb --maintenance-db=postgres hamamooz_restore
          docker run --rm --network host \
            --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD \
            --env PGDATABASE=hamamooz_restore \
            --volume "$PWD/scripts:/scripts:ro" --volume "$BACKUP_DIR:/backups:ro" \
            postgres:17-alpine /scripts/restore_postgres.sh "/backups/$backup_name"
          restored_migrations="$(docker run --rm --network host \
            --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD \
            --env PGDATABASE=hamamooz_restore postgres:17-alpine \
            psql --tuples-only --no-align \
            --command 'SELECT COUNT(*) FROM django_migrations;')"
          test "$restored_migrations" -gt 0
