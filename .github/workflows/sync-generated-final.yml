name: Sync Final Generated API Artifacts

on:
  push:
    branches:
      - backend/comprehensive-manual-hardening
    paths:
      - .github/workflows/sync-generated-final.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hamamooz_test
          POSTGRES_USER: hamamooz
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hamamooz -d hamamooz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://hamamooz:test-password@localhost:5432/hamamooz_test
      DJANGO_SECRET_KEY: ci-only-secret-key-at-least-50-characters-long-123456
      USE_S3: "false"
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend/comprehensive-manual-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements/*.txt
      - name: Install backend dependencies
        working-directory: Backend
        run: pip install -r requirements/dev.txt
      - name: Generate OpenAPI
        working-directory: Backend
        run: |
          python manage.py spectacular \
            --api-version v1 \
            --file ../contracts/openapi.yaml \
            --validate
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Generate frontend API catalog
        working-directory: Frontend
        run: npm run generate:api
      - name: Align manual delete with documented query contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Frontend/src/pages/manual-entry.ts')
          text = path.read_text()
          old = """apiRequest(endpoints.monthlyEvaluations.manualDelete(id), {\n      method: 'DELETE',\n      body: { reason: reason.value.trim() },\n      responseType: 'void',\n    })"""
          new = """apiRequest(endpoints.monthlyEvaluations.manualDelete(id), {\n      method: 'DELETE',\n      query: { reason: reason.value.trim() },\n      responseType: 'void',\n    })"""
          if old not in text and new not in text:
              raise SystemExit('manual delete request shape not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.yaml Frontend/src/api/generated/catalog.json Frontend/src/api/generated/catalog.ts Frontend/src/pages/manual-entry.ts
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m "chore: regenerate final API contract and frontend catalog"
          git push origin HEAD:backend/comprehensive-manual-hardening
