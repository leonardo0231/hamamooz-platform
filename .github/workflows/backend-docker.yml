name: Backend Docker Build


on:

  workflow_dispatch:

  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-docker.yml"

  push:
    branches:
      - "backend/mvp-bootstrap"
    paths:
      - "Backend/**"
      - ".github/workflows/backend-docker.yml"


jobs:

  docker:

    runs-on: ubuntu-latest


    steps:


      - uses: actions/checkout@v4


      - name: Build Backend Image

        run: |

          docker build \
          -t hamamooz-backend-test \
          ./Backend
