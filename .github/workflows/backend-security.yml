name: Backend Security


on:

  workflow_dispatch:

  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-security.yml"

  push:
    branches:
      - "backend/mvp-bootstrap"
    paths:
      - "Backend/**"
      - ".github/workflows/backend-security.yml"


jobs:

  security:

    runs-on: ubuntu-latest


    steps:


      - uses: actions/checkout@v4


      - name: Python Security Scan

        uses: pypa/gh-action-pip-audit@v1
