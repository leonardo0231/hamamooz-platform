x-backend-service: &backend-service
  build: .
  env_file:
    - .env.production
  networks:
    - backend

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

    env_file:
      - .env.production

    command:
      - /bin/sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

        exec redis-server \
          --appendonly yes \
          --requirepass "$${REDIS_PASSWORD}"

    volumes:
      - redis_data:/data

    networks:
      - backend

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG",
        ]

      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    env_file:
      - .env.production
    volumes:
      - minio_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file:
      - .env.production
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
        : "$${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
        : "$${AWS_STORAGE_BUCKET_NAME:?AWS_STORAGE_BUCKET_NAME is required}"

        mc alias set \
          local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"

        mc mb \
          --ignore-existing \
          "local/$${AWS_STORAGE_BUCKET_NAME}"

        mc anonymous set \
          none \
          "local/$${AWS_STORAGE_BUCKET_NAME}"

  migrate:
    <<: *backend-service
    command:
      - uv
      - run
      - python
      - manage.py
      - migrate
      - --noinput
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  api:
    <<: *backend-service
    command:
      - uv
      - run
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "120"
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8000/api/v1/health/",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend-service
    command:
      - uv
      - run
      - celery
      - -A
      - config
      - worker
      - --hostname=worker@%h
      - --loglevel=INFO
      - --queues=default
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run celery -A config inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-client:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z

    profiles:
      - ops

    env_file:
      - .env.production

    networks:
      - backend

    volumes:
      - ${BACKUP_WORKDIR:-./backups}:/backup

    entrypoint:
      - /bin/sh
      - -ec

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data: