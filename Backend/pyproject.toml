[project]
name = "hamamooz-backend"
version = "0.1.0"
description = "HamAmoz multi-branch school platform MVP backend"
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-warnings"

[tool.coverage.run]
branch = true
source = ["hamamooz"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["config", "hamamooz"]
