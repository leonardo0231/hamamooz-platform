      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - draft
          - locked
          - rejected
          - submitted
        description: |-
          * `draft` - پیش‌نویس
          * `submitted` - ارسال‌شده برای تأیید
          * `rejected` - ردشده
          * `approved` - تأییدشده
          * `locked` - قفل‌شده
