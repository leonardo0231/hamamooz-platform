name: hamamooz-mvp

x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - static_data:/app/staticfiles
    - media_data:/app/media

services:
  release:
    <<: *app
    restart: "no"
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  web:
    <<: *app
    expose:
      - "8000"
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready/"]
      interval: 20s
      timeout: 7s
      retries: 8

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

  worker:
    <<: *app
    command: celery -A config worker -l INFO -Q default,imports,reports,calculations,notifications --concurrency=2
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5

  beat:
    <<: *app
    command: celery -A config beat -l INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      release:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hamamooz}
      POSTGRES_USER: ${POSTGRES_USER:-hamamooz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-broker:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_broker_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be set}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be set}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000
      $${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be set}
      $${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be set} &&
      mc mb --ignore-existing local/$${AWS_STORAGE_BUCKET_NAME:?AWS_STORAGE_BUCKET_NAME must be set} &&
      mc version enable local/$${AWS_STORAGE_BUCKET_NAME:?AWS_STORAGE_BUCKET_NAME must be set} &&
      mc anonymous set none local/$${AWS_STORAGE_BUCKET_NAME:?AWS_STORAGE_BUCKET_NAME must be set}"
    env_file: .env

  backup-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-hamamooz}
      PGUSER: ${POSTGRES_USER:-hamamooz}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_DIR: /backups/postgres
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/scripts/backup_loop.sh"]

  backup-media:
    image: alpine:3.22
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_SOURCE_DIR: /media
      BACKUP_DIR: /backups/media
    volumes:
      - ./scripts:/scripts:ro
      - media_data:/media:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/scripts/backup_media_loop.sh"]

  backup-storage:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["s3"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/scripts/backup_minio_loop.sh"]

volumes:
  postgres_data:
  redis_cache_data:
  redis_broker_data:
  minio_data:
  media_data:
  static_data:
  backup_data:
