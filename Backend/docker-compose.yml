name: hamamooz-mvp

x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  volumes:
    - static_data:/app/staticfiles
    - media_data:/app/media

services:
  frontend:
    build:
      context: ../Frontend
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "3000:80"

  web:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live/"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    entrypoint: []
    command: celery -A config worker -l INFO -Q default,imports,reports,calculations --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hamamooz}
      POSTGRES_USER: ${POSTGRES_USER:-hamamooz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-hamamooz}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me-minio}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID:-hamamooz} $${AWS_SECRET_ACCESS_KEY:-change-me-minio} &&
      mc mb --ignore-existing local/$${AWS_STORAGE_BUCKET_NAME:-hamamooz-private} &&
      mc anonymous set none local/$${AWS_STORAGE_BUCKET_NAME:-hamamooz-private}
      "
    env_file: .env

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-hamamooz}
      PGUSER: ${POSTGRES_USER:-hamamooz}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      BACKUP_DIR: /backups
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/scripts/backup_loop.sh"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_data:
  static_data:
  backup_data:
