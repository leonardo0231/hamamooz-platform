# Local all-in-one stack.
# Start everything with: docker compose up --build -d
name: hamamooz

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-hamamooz-local-dev-secret-change-before-production}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web,frontend}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  POSTGRES_DB: ${POSTGRES_DB:-hamamooz}
  POSTGRES_USER: ${POSTGRES_USER:-hamamooz}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamamooz-local-password}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  DATABASE_URL: ${DATABASE_URL:-}
  REDIS_URL: ${REDIS_URL:-redis://redis-cache:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis-broker:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis-broker:6379/1}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
  USE_S3: ${USE_S3:-false}
  READINESS_CHECK_BROKER: ${READINESS_CHECK_BROKER:-false}
  READINESS_CHECK_STORAGE: ${READINESS_CHECK_STORAGE:-true}
  SEED_DEMO: ${SEED_DEMO:-false}
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!ChangeMe}

x-backend: &backend
  build:
    context: ./Backend
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  environment: *backend-environment
  restart: unless-stopped
  init: true
  volumes:
    - static_data:/app/staticfiles
    - media_data:/app/media

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hamamooz}
      POSTGRES_USER: ${POSTGRES_USER:-hamamooz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamamooz-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis-broker:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_broker_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  release:
    <<: *backend
    restart: "no"
    command: >-
      sh -ec "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  bootstrap:
    <<: *backend
    restart: "no"
    command: >-
      sh -ec 'if [ "$${SEED_DEMO}" = "true" ]; then
      python manage.py seed_demo
      --admin-username "$${SEED_ADMIN_USERNAME}"
      --admin-email "$${SEED_ADMIN_EMAIL}"
      --admin-password "$${SEED_ADMIN_PASSWORD}";
      else echo "Demo seed is disabled (SEED_DEMO=false)."; fi'
    depends_on:
      release:
        condition: service_completed_successfully

  web:
    <<: *backend
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${HAMAMOOZ_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready/"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *backend
    command: celery -A config worker -l INFO -Q default,imports,reports,calculations,notifications --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s

  beat:
    <<: *backend
    command: celery -A config beat -l INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    stop_grace_period: 30s

  frontend:
    build:
      context: ./Frontend
    restart: unless-stopped
    init: true
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HAMAMOOZ_FRONTEND_PORT:-5173}:8080"
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_cache_data:
  redis_broker_data:
  static_data:
  media_data:
